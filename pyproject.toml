[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codegraph-loc"
version = "0.1.0"
description = "Open code-graph generator and function-level bug-localization benchmark for small local coding agents"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["networkx>=3.2", "numpy>=1.26"]

[project.optional-dependencies]
baselines = ["rank-bm25>=0.2.2", "scipy>=1.11"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixture_repo"]
pythonpath = ["src"]
